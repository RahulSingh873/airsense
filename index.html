<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AirSense — Live Air Quality & Health Advisory</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="app-header">
    <h1 class="logo">AirSense</h1>
    <p class="tagline">Is it safe to go outside today?</p>
  </header>

  <main class="container">

    <section class="search-section">
      <div class="search-bar">
        <input type="text" id="city-input" placeholder="Search any city..." autocomplete="off">
        <button id="search-btn">Search</button>
      </div>
      <div class="quick-select">
        <button class="quick-btn" data-city="Delhi">Delhi</button>
        <button class="quick-btn" data-city="Mumbai">Mumbai</button>
        <button class="quick-btn" data-city="Bengaluru">Bengaluru</button>
        <button class="quick-btn" data-city="Ghaziabad">Ghaziabad</button>
      </div>
    </section>

    <section id="status-message" class="status-message"></section>

    <section id="empty-state" class="empty-state">
      <div class="empty-state-icon">🌤️</div>
      <p>Search a city to get started</p>
    </section>
    
    <section id="snapshot-card" class="snapshot-card hidden"></section>
    <section id="personalization-section" class="personalization-section hidden">
      <h3>A little about you</h3>
      <div class="question-group">
        <p>Do you belong to a sensitive group? (asthma, elderly, child, respiratory condition)</p>
        <div class="toggle-options">
          <button class="toggle-btn" data-question="sensitive" data-value="true">Yes</button>
          <button class="toggle-btn" data-question="sensitive" data-value="false">No</button>
        </div>
      </div>
      <div class="question-group">
        <p>Are you planning outdoor activity today? (exercise, commute, errands)</p>
        <div class="toggle-options">
          <button class="toggle-btn" data-question="outdoor" data-value="true">Yes</button>
          <button class="toggle-btn" data-question="outdoor" data-value="false">No</button>
        </div>
      </div>
      <button id="get-recommendation-btn" disabled>Get My Recommendation</button>
    </section>

    <section id="ai-card" class="ai-card hidden"></section>

    <button id="compare-toggle-btn" class="compare-toggle-btn">+ Compare with another city</button>

    <section id="compare-section" class="compare-section hidden">
      <div class="search-bar">
        <input type="text" id="city-input-2" placeholder="Search a second city..." autocomplete="off">
        <button id="search-btn-2">Search</button>
      </div>
      <div id="snapshot-card-2" class="snapshot-card hidden"></div>
    </section>



  </main>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/score.js"></script>
  <script src="js/claude.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
